server:
  port: 9090

spring:
  application:
    name: hibernate-envers
      
  datasource:
    url: jdbc:h2:mem:testdb  # In-memory database
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    open-in-view: false
    #database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true  # Enable SQL logging
    properties:
      hibernate.jdbc.time_zone: America/Chicago    
  h2:
    console:
      enabled: true   # Enable H2 web console
     # path: /h2-console  # Access via http://localhost:8080/h2-console
     # settings:
     #   web-allow-others: true
  liquibase:
    enabled: false  # Disable if not using Liquibase migrations

# Envers Configuration
