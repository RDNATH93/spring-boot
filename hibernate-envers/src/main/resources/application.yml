#  org.hibernate.envers.audit_table_suffix: _AUD  # Append "_AUD" to audit tables
#  org.hibernate.envers.revision_field_name: REV  # Name for revision column
#  org.hibernate.envers.revision_type_field_name: REVTYPE  # Name for revision type column
