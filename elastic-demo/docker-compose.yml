services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      #- ELASTIC_PASSWORD=changeme
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=https://super-duper-pancake-j9qx995q4pgfpvqv-9200.app.github.dev
      #- ELASTICSEARCH_USERNAME=elastic
      #- ELASTICSEARCH_PASSWORD=changeme
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.17.3
    container_name: apm-server
    environment:
      - output.elasticsearch.hosts=["https://super-duper-pancake-j9qx995q4pgfpvqv-9200.app.github.dev"]
      #- output.elasticsearch.service_token=AAEAAWVsYXN0aWMva2liYW5hL2RlZmF1bHQ6Vk91OFBRMy1URW1vaWE5NThoNEhwdw
    ports:
      - "8200:8200"
    depends_on:
      - elasticsearch

volumes:
  esdata: